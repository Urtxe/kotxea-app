name: Deploy Kotxea

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kotxea-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install application and rules-test dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.36.0

      - name: Check existing application tests
        run: npm test

      - name: Check Firestore rules in the emulator
        run: npm run test:rules

      - name: Check Cloud Functions source
        run: node --check functions/index.js

      - name: Prepare hosting files
        run: node scripts/prepare-hosting.js

      - name: Validate Firebase deployment
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOTXEA_URTXE }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_KOTXEA_URTXE" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --dry-run --only hosting,firestore:rules,firestore:indexes,functions --project kotxea-urtxe

      - name: Deploy Hosting, Firestore rules, indexes, and Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes,functions --project kotxea-urtxe

      - name: Remove temporary Firebase credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
